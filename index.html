<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>DevOps Todo App</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        ul { list-style: none; padding: 0; }
        li { padding: 10px; border-bottom: 1px solid #eee; display: flex; align-items: center; }
        .status { margin-right: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Список задач</h1>
        <ul id="task-list">
            <li>Загрузка задач...</li>
        </ul>
    </div>

    <script>
        const API_URL = 'http://192.168.122.218:8000/tasks';

        async function fetchTasks() {
            try {
                const response = await fetch(API_URL);
                const tasks = await response.json();
                
                const listElement = document.getElementById('task-list');
                listElement.innerHTML = ''; // Очищаем список

                tasks.forEach(task => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <input type="checkbox" class="status" ${task.completed ? 'checked' : ''} disabled>
                        <span>${task.title}</span>
                    `;
                    listElement.appendChild(li);
                });
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('task-list').innerHTML = '<li>Ошибка загрузки данных</li>';
            }
        }

        fetchTasks();
    </script>
</body>
</html>
